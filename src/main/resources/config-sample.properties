# Configuración de la conexión y los datos locales de la aplicación.
# URL JDBC de MySQL; el puerto 3307 es el que publica Docker.
database.url=jdbc:mysql://localhost:3307/deadlock?allowMultiQueries=true&createDatabaseIfNotExist=true
# Activa la creación de tablas al iniciar.
database.init.tables=true
# Carpeta para guardar datos locales.
storage.data=data
# Usuario y contraseña usados para conectar con MySQL.
database.user=root
database.password=abc123
